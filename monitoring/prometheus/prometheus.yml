# Prometheus 抓取配置
# 说明：监控栈通常以 Docker 方式运行，后端 API 若跑在宿主机，使用 host.docker.internal；
#       若后端同样在 docker-compose 网络内，把目标改为 backend:8000。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      # 本地开发（后端宿主机）：host.docker.internal:8000
      # 全容器部署时改为：backend:8000
      - targets: ["host.docker.internal:8000"]

  - job_name: "backend-business"
    metrics_path: /metrics/business
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]