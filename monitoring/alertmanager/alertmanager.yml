# Alertmanager 告警路由配置
# 默认路由到后端告警 webhook（后端 /api/v1/alerts/webhook：结构化日志 + 按 ALERT_WEBHOOK_URL 转发）。
# 若直接走外部渠道，可在 receiver 下配置钉钉/企业微信/邮件（见下方注释模板）。
route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "backend-webhook"

receivers:
  - name: "backend-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:8000/api/v1/alerts/webhook"
        send_resolved: true

  # 直接对接钉钉机器人（替换 access_token；后端也会在 ALERT_WEBHOOK_URL 置空时仅本地日志）
  # - name: "dingtalk"
  #   webhook_configs:
  #     - url: "https://oapi.dingtalk.com/robot/send?access_token=<TOKEN>"

  # 直接对接企业微信机器人
  # - name: "wecom"
  #   webhook_configs:
  #     - url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=<KEY>"

  # 邮件告警（SMTP）
  # - name: "email"
  #   email_configs:
  #     - to: "ops@example.com"
  #       from: "alerts@example.com"
  #       smarthost: "smtp.example.com:587"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job"]