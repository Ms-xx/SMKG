# Logstash 管道配置
# 从 Filebeat 接收事件，解析时间戳，写入 Elasticsearch。
input {
  beats {
    port => 5044
  }
}

filter {
  # 将日志中的 asctime（"2024-01-01 10:00:00,123"）解析为 @timestamp
  date {
    match => ["asctime", "yyyy-MM-dd HH:mm:ss,SSS", "ISO8601"]
    target => "@timestamp"
    timezone => "Asia/Shanghai"
  }
  # 统一日志级别字段
  mutate {
    rename => { "levelname" => "level" }
  }
  # 后端告警结构化日志：message 内嵌 JSON（{"event":"alert",...}），提升为可检索字段 alert_detail.*
  # 之后可在 Kibana 以 alert_detail.event:"alert" / alert_detail.alertname:"CeleryQueueBacklog" 精确检索
  if [message] =~ /"event"\s*:\s*"alert"/ {
    json {
      source => "message"
      target => "alert_detail"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "backend-logs-%{+YYYY.MM.dd}"
  }
  # 开发调试时可保留，把已处理事件打印到 stdout
  # stdout { codec => rubydebug }
}