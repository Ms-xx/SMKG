# Celery 异步任务 worker（消费 parsing/extraction/graph/training 队列）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: smkg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: smkg/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - -l
            - info
            - -Q
            - parsing,extraction,graph,training
          envFrom:
            - configMapRef:
                name: smkg-config
            - secretRef:
                name: smkg-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
          # worker 无 HTTP 端口：以 broker 控制通道回包判定「已连上 broker 且未僵死」
          readinessProbe:
            exec:
              command: ["sh", "-c", "celery -A app.core.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A app.core.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker
  namespace: smkg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70