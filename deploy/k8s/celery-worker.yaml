# Celery 异步任务 worker（消费 parsing/extraction/graph 队列）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: smkg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: smkg/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - -l
            - info
            - -Q
            - parsing,extraction,graph
          envFrom:
            - configMapRef:
                name: smkg-config
            - secretRef:
                name: smkg-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker
  namespace: smkg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70